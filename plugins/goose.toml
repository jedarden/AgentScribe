# Goose plugin for AgentScribe
# Goose stores conversations as JSONL files with session metadata on the first line

[plugin]
name = "goose"
version = "1.0"

[source]
paths = [
    "~/.local/share/goose/sessions/*.jsonl"
]
exclude = []
format = "jsonl"

[source.session_detection]
method = "one-file-per-session"
session_id_from = "filename"

[parser]
timestamp = "timestamp"
role = "role"
content = "content"

[parser.static]
source_agent = "goose"

[parser.project]
method = "field"
field = "working_dir"

[parser.model]
source = "none"

[parser.file_paths]
content_regex = true
