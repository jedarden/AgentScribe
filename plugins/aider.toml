# Aider plugin for AgentScribe
# Aider stores conversations in append-only Markdown files
#
# Companion index decision (bf-xp9w):
# Aider analytics JSONL (~/.aider.analytics.jsonl) is NOT wired as a companion_index
# because it lacks session-level identifiers needed for correlation. Analytics events
# only contain persistent user_id (not session-specific) and timestamps that cannot
# be reliably matched to chat delimiter timestamps due to timezone ambiguity and
# lack of 1:1 mapping. See notes/bf-xp9w.md for full analysis.

[plugin]
name = "aider"
version = "1.0"

[source]
paths = [
    "~/**/.aider.chat.history.md"
]
exclude = [
    "~/**/node_modules/**/.aider.chat.history.md",
    "~/**/target/**/.aider.chat.history.md",
    "~/**/.git/**/.aider.chat.history.md",
    "~/**/.cache/**/.aider.chat.history.md",
    "~/**/venv/**/.aider.chat.history.md",
    "~/**/.venv/**/.aider.chat.history.md",
    "~/**/__pycache__/**/.aider.chat.history.md",
    "~/**/build/**/.aider.chat.history.md",
    "~/**/dist/**/.aider.chat.history.md"
]
format = "markdown"

[source.session_detection]
method = "delimiter"
delimiter_pattern = "^# aider chat started at "

[parser]
user_prefix = "#### "
assistant_prefix = ""
tool_prefix = "> "

[parser.static]
source_agent = "aider"

[parser.project]
method = "parent_dir"

[parser.model]
source = "none"

[parser.file_paths]
content_regex = true
